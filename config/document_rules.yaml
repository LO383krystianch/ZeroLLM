# =============================================================================
# Reguły klasyfikacji i ekstrakcji dokumentów — ODWOŁANIA2JSON
# =============================================================================
#
# Ten plik jest jedynym źródłem prawdy dla typów dokumentów, pól i reguł.
# Dodanie nowego typu dokumentu lub pola wymaga wyłącznie edycji tego pliku
# (wzorzec Registry) — bez zmian w kodzie Pythona.
#
# Typ pola (type):
#   string / date / number / boolean / integer -> wartość skalarna + rules[]
#   object -> zagnieżdżone pola w `fields`
#   array  -> elementy opisane w `items.fields` (na razie ekstrahowany 1 element)
#
# Segmentacja kontekstowa (sections):
#   Tekst jest dzielony na bloki kontekstowe wg markerów `start` (kolejność ma
#   znaczenie). Pole z kluczem `section` jest parsowane WYŁĄCZNIE w tym bloku.
#   `section` może być zdefiniowane na obiekcie/tablicy i dziedziczone przez pola.
#
# Reguła ekstrakcji (kind):
#   regex -> pattern, group (nr grupy, domyślnie 0), flags [IGNORECASE, MULTILINE, DOTALL],
#            output: value (domyślnie) | boolean (sama obecność wzorca),
#            require: wzorzec, który musi wystąpić w tekście (inaczej reguła pominięta),
#            after: marker — dopasowanie szukane dopiero po jego wystąpieniu,
#            normalize: whitespace — zbicie białych znaków w wartości
#
# Każde wyekstrahowane pole zwraca obiekt: {value, source_text, rule_used}.

version: "2.0"

document_types:
  # ---------------------------------------------------------------------------
  # 1. Odwołanie do KIO
  # ---------------------------------------------------------------------------
  odwolanie:
    label: "Odwołanie do KIO"
    classification:
      - kind: regex
        pattern: '\b(?:odwołanie|odwołuj|KIO|Krajowa Izba Odwoławcza)\b'
        flags: [IGNORECASE]
    sections:
      - name: Naglowek
        start: 'Krajowa Izba Odwoławcza'
        flags: [IGNORECASE]
      - name: Zamawiajacy
        start: '^\s*Zamawiający\s*:'
        flags: [IGNORECASE, MULTILINE]
      - name: Odwolujacy
        start: '^\s*Odwołujący\s*:'
        flags: [IGNORECASE, MULTILINE]
      - name: Zarzuty
        start: '^\s*ODWOŁANIE\s*$'
        flags: [MULTILINE]
    structure:
      OdwolanieKIO:
        type: object
        fields:
          data:
            type: date
            section: Odwolujacy
            rules:
              - kind: regex
                pattern: '\b(\d{1,2}\s+(?:stycznia|lutego|marca|kwietnia|maja|czerwca|lipca|sierpnia|września|października|listopada|grudnia)\s+\d{4})'
                group: 1
                flags: [IGNORECASE, MULTILINE]
          czynnosc_dzien:
            type: date
            section: Zarzuty
            rules:
              - kind: regex
                pattern: '\bw dniu\s+(\d{1,2}\s+(?:stycznia|lutego|marca|kwietnia|maja|czerwca|lipca|sierpnia|września|października|listopada|grudnia)\s+\d{4})'
                group: 1
                flags: [IGNORECASE]
          czynnosc_powod_id:
            type: integer
            section: Zarzuty
            rules:
              - kind: regex
                pattern: '\bart\.?\s*(\d+)'
                group: 1
                flags: [IGNORECASE]
          czynnosc_opis:
            type: string
            section: Zarzuty
            rules:
              - kind: regex
                pattern: '\bczynno(?:ść|sc)\w*\s+Zamawiającego\s*[–—-]\s*([^\r\n]+)'
                group: 1
                flags: [IGNORECASE]
          miejscowosc:
            type: string
            section: Odwolujacy
            rules:
              - kind: regex
                pattern: '^\s*([A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)\s*,\s*\d{1,2}\s+[a-ząćęłńóśźż]+'
                group: 1
                flags: [MULTILINE]

      Odwolujacy:
        type: array
        section: Odwolujacy
        items:
          fields:
            krs:
              type: string
              rules:
                - kind: regex
                  require: 'Konsorcjum'
                  after: 'Lider\s+Konsorcjum\s*:'
                  pattern: '\bKRS[ \t]*[:.]?[ \t]*(\d{10})'
                  group: 1
                  flags: [IGNORECASE]
                - kind: regex
                  pattern: '\bKRS[ \t]*[:.]?[ \t]*(\d{10})'
                  group: 1
                  flags: [IGNORECASE]
            nazwa:
              type: string
              rules:
                - kind: regex
                  require: 'Konsorcjum'
                  after: 'Lider\s+Konsorcjum\s*:'
                  pattern: '^\s*([^\r\n]+)'
                  group: 1
                  flags: [IGNORECASE, MULTILINE]
                - kind: regex
                  pattern: '\bOdwołując\w*[ \t]*[:.]?[ \t]*([^\r\n]+)'
                  group: 1
                  flags: [IGNORECASE]
            nip:
              type: string
              rules:
                - kind: regex
                  require: 'Konsorcjum'
                  after: 'Lider\s+Konsorcjum\s*:'
                  pattern: '\bNIP[ \t]*[:.]?[ \t]*(\d{3}[- ]?\d{3}[- ]?\d{2}[- ]?\d{2})'
                  group: 1
                  flags: [IGNORECASE]
                - kind: regex
                  pattern: '\bNIP[ \t]*[:.]?[ \t]*(\d{3}[- ]?\d{3}[- ]?\d{2}[- ]?\d{2})'
                  group: 1
                  flags: [IGNORECASE]
            regon:
              type: string
              rules:
                - kind: regex
                  require: 'Konsorcjum'
                  after: 'Lider\s+Konsorcjum\s*:'
                  pattern: '\bREGON[ \t]*[:.]?[ \t]*(\d{9}(?:\d{5})?)'
                  group: 1
                  flags: [IGNORECASE]
                - kind: regex
                  pattern: '\bREGON[ \t]*[:.]?[ \t]*(\d{9}(?:\d{5})?)'
                  group: 1
                  flags: [IGNORECASE]
            "przez-pelnomocnika":
              type: boolean
              rules:
                - kind: regex
                  pattern: '\b(?:reprezentowan\w*\s+przez|przez\s+pełnomocnika)\b'
                  output: boolean
                  flags: [IGNORECASE]
            pelnomocnik:
              type: string
              rules:
                - kind: regex
                  pattern: '\breprezentowan\w*\s+przez[ \t]*[:.]?[ \t]*([^\r\n]+)'
                  group: 1
                  flags: [IGNORECASE]

      Zamawiajacy:
        type: array
        section: Zamawiajacy
        items:
          fields:
            nazwa:
              type: string
              rules:
                - kind: regex
                  pattern: '\bZamawiając\w*\s*[:.]?\s*([^\r\n]+)'
                  group: 1
                  flags: [IGNORECASE]
            nip:
              type: string
              rules:
                - kind: regex
                  pattern: '\bNIP[ \t]*[:.]?[ \t]*(\d{3}[- ]?\d{3}[- ]?\d{2}[- ]?\d{2})'
                  group: 1
                  flags: [IGNORECASE]
            regon:
              type: string
              rules:
                - kind: regex
                  pattern: '\bREGON[ \t]*[:.]?[ \t]*(\d{9}(?:\d{5})?)'
                  group: 1
                  flags: [IGNORECASE]
            adres:
              type: string
              rules:
                - kind: regex
                  pattern: '\b(?:adres|ul\.)[ \t]*[:.]?[ \t]*([^\r\n]+)'
                  group: 1
                  flags: [IGNORECASE]

      ZamowieniePubliczne:
        type: object
        section: Odwolujacy
        fields:
          numer_postepowania:
            type: string
            rules:
              - kind: regex
                pattern: '\b(?:nr|numer)\s+(?:referencyjny|postępowania|sprawy)[ \t]*[:.]?[ \t]*([A-Za-z0-9][A-Za-z0-9./\-]*)'
                group: 1
                flags: [IGNORECASE]
          nazwa:
            type: string
            rules:
              - kind: regex
                pattern: '\bpn\.\s*[„"]?\s*([\s\S]*?)\s*[”"]'
                group: 1
                normalize: whitespace
                flags: [IGNORECASE]
          tryb:
            type: string
            rules:
              - kind: regex
                pattern: '\btryb(?:ie|em|u)?\s*[:.]?\s*([^\r\n]+?)(?=\s+pn\.)'
                group: 1
                flags: [IGNORECASE]
          data_ogloszenia:
            type: date
            section: Zarzuty
            rules:
              - kind: regex
                pattern: '\b(\d{1,2}\.\d{1,2}\.\d{4})\s*\n?\s*Publikacja'
                group: 1
                flags: [IGNORECASE, MULTILINE]

  # ---------------------------------------------------------------------------
  # 2. Pełnomocnictwo
  # ---------------------------------------------------------------------------
  pelnomocnictwo:
    label: "Pełnomocnictwo"
    classification:
      - kind: regex
        pattern: '\b(?:pełnomocnictwo|pełnomocnik|mocodawca)\b'
        flags: [IGNORECASE]
    structure:
      mocodawca:
        type: object
        fields:
          dane_osoby:
            type: object
            fields:
              imie_nazwisko:
                type: string
                rules:
                  - kind: regex
                    pattern: '\b(?:imię i nazwisko|imie i nazwisko)[ \t]*[:.]?[ \t]*([^\r\n]+)'
                    group: 1
                    flags: [IGNORECASE]
              pesel:
                type: string
                rules:
                  - kind: regex
                    pattern: '\bPESEL[ \t]*[:.]?[ \t]*(\d{11})'
                    group: 1
                    flags: [IGNORECASE]
              adres:
                type: string
                rules:
                  - kind: regex
                    pattern: '\b(?:adres|zamieszkał\w*|zamieszkal\w*)[ \t]*[:.]?[ \t]*([^\r\n]+)'
                    group: 1
                    flags: [IGNORECASE]
          podpisujacy:
            type: object
            fields:
              imie_nazwisko:
                type: string
                rules:
                  - kind: regex
                    pattern: '\bpodpisując\w*[ \t]*[:.]?[ \t]*([^\r\n]+)'
                    group: 1
                    flags: [IGNORECASE]
      pelnomocnicy:
        type: array
        items:
          fields:
            imie_nazwisko:
              type: string
              rules:
                - kind: regex
                  pattern: '\bpełnomocnik\w*[ \t]*[:.]?[ \t]*([^\r\n]+)'
                  group: 1
                  flags: [IGNORECASE]
            pesel:
              type: string
              rules:
                - kind: regex
                  pattern: '\bPESEL[ \t]*[:.]?[ \t]*(\d{11})'
                  group: 1
                  flags: [IGNORECASE]
            adres:
              type: string
              rules:
                - kind: regex
                  pattern: '\b(?:adres|zamieszkał\w*|zamieszkal\w*)[ \t]*[:.]?[ \t]*([^\r\n]+)'
                  group: 1
                  flags: [IGNORECASE]

  # ---------------------------------------------------------------------------
  # 3. Przelew bankowy
  # ---------------------------------------------------------------------------
  przelew:
    label: "Przelew bankowy"
    classification:
      - kind: regex
        pattern: '\b(?:przelew|potwierdzenie przelewu|dowód wpłaty)\b'
        flags: [IGNORECASE]
    structure:
      przelew_bankowy:
        type: object
        fields:
          data_operacji:
            type: date
            rules:
              - kind: regex
                pattern: '\bdata\s+operacji[ \t]*[:.]?[ \t]*(\d{1,2}[./-]\d{1,2}[./-]\d{2,4})'
                group: 1
                flags: [IGNORECASE, MULTILINE]
          kwota:
            type: number
            rules:
              - kind: regex
                pattern: '\bkwota[ \t]*[:.]?[ \t]*([\d\s]+[.,]\d{2})\s*(?:PLN|zł)?'
                group: 1
                flags: [IGNORECASE]
          na_rachunek:
            type: string
            rules:
              - kind: regex
                pattern: '\b(?:na\s+rachunek|rachunek\s+odbiorcy|odbiorca)[ \t]*[:.]?[ \t]*([A-Z]{2}[0-9\s]{18,30})'
                group: 1
                flags: [IGNORECASE]
          numer_transakcji:
            type: string
            rules:
              - kind: regex
                pattern: '\b(?:numer|nr)\s+transakcji[ \t]*[:.]?[ \t]*([A-Za-z0-9/.\-]+)'
                group: 1
                flags: [IGNORECASE]
          tytul:
            type: string
            rules:
              - kind: regex
                pattern: '\btytuł(?:em|u)?[ \t]*[:.]?[ \t]*([^\r\n]+)'
                group: 1
                flags: [IGNORECASE]
          z_rachunku:
            type: string
            rules:
              - kind: regex
                pattern: '\b(?:z\s+rachunku|rachunek\s+nadawcy)[ \t]*[:.]?[ \t]*([A-Z]{2}[0-9\s]{18,30})'
                group: 1
                flags: [IGNORECASE]
