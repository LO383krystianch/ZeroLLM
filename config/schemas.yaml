# Schematy dokumentów i reguły ekstrakcji/klasyfikacji dla ODWOŁANIA2JSON.
# Nowe typy dokumentów oraz pola dodaje się tutaj, bez zmiany głównego kodu.

version: "1.0"

default_document_type: odwolanie

document_types:
  odwolanie:
    description: "Odwołanie (pismo odwoławcze) z wyodrębnionymi polami."
    fields:
      - name: sygnatura
        type: string
        required: true
      - name: data_pisma
        type: date
      - name: imie_nazwisko
        type: string
      - name: tytul_odwolania
        type: string
      - name: tresc
        type: text
    extraction_rules:
      sygnatura:
        - pattern: '(?i)syg(?:natura)?\.?\s*[:\\-]?\s*([A-Za-z0-9/\\-]+)'
          source: text
      data_pisma:
        - pattern: '(?i)data[:\\-]?\s*(\d{1,2}[.\\-/]\d{1,2}[.\\-/]\d{2,4})'
          source: text

# Informacje o transparentności ekstrakcji dołączane do wyniku JSON.
transparency:
  include_source_fragment: true
  include_matched_rule: true
